[package]
name = "bb_safe"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Buldog Boost — безпечні системні модулі (захист процесів, права адміністратора)"

[lib]
name = "bb_safe"
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"   # паніка не має перетинати кордон FFI
strip = true
